components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: staffora.sid
      description: Server-side session stored in PostgreSQL `user_sessions` (ADR-006).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token from login or `GET /auth/csrf-token`; required on every POST, PUT, PATCH, and DELETE, including `POST /auth/login`.
  responses:
    UnauthorizedResponse:
      description: Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenResponse:
      description: Access forbidden (RBAC or CSRF violation)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationErrorResponse:
      description: Validation failed for request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotImplementedResponse:
      description: Feature not implemented in Sprint 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [message, code, errors, meta, requestId]
      properties:
        message: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        meta: { type: object }
        requestId: { type: string }

    CapacityConflictResponse:
      type: object
      required: [message, code, errors, meta, requestId]
      properties:
        message:
          { type: string, example: "Allocation exceeds employee capacity." }
        code: { type: string, example: "CAPACITY_CONFLICT" }
        errors: { type: object }
        meta:
          type: object
          required:
            [
              peakAllocation,
              requestedAllocation,
              remainingCapacity,
              conflictStartDate,
              conflictEndDate,
            ]
          properties:
            peakAllocation: { type: integer, example: 80 }
            requestedAllocation: { type: integer, example: 30 }
            remainingCapacity: { type: integer, example: 20 }
            conflictStartDate:
              { type: string, format: date, example: "2026-11-01" }
            conflictEndDate:
              { type: string, format: date, example: "2026-11-15" }
        requestId: { type: string }

    UserIdentity:
      type: object
      required: [id, email, role, isActive]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role:
          {
            type: string,
            enum: [ADMIN, PROJECT_MANAGER, RESOURCE_MANAGER, EMPLOYEE],
          }
        isActive: { type: boolean }
        employeeId: { type: string, format: uuid, nullable: true }
        employee:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            employeeCode: { type: string }
            fullName: { type: string }
            workEmail: { type: string }
            departmentId: { type: string, format: uuid }
            departmentName: { type: string }
            jobRoleId: { type: string, format: uuid }
            jobRoleTitle: { type: string }

    LoginResult:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/UserIdentity"
        csrfToken:
          type: string
          description: Synchronizer token for the new session; send as `X-CSRF-Token` on state-changing requests.

    CreateUserInput:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        role:
          type: string
          enum: [ADMIN, PROJECT_MANAGER, RESOURCE_MANAGER, EMPLOYEE]
        employeeId: { type: string, format: uuid, nullable: true }

    UpdateUserInput:
      type: object
      properties:
        role:
          type: string
          enum: [ADMIN, PROJECT_MANAGER, RESOURCE_MANAGER, EMPLOYEE]
        isActive: { type: boolean }
        employeeId: { type: string, format: uuid, nullable: true }

    UserListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/UserIdentity"

    Department:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    DepartmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Department"

    JobRole:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    JobRoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JobRole"

    Skill:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    SkillListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Skill"

    EmployeeSkill:
      type: object
      required: [id, skillId, skillName, proficiencyLevel]
      properties:
        id: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        skillName: { type: string }
        skillIsActive: { type: boolean }
        proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    CreateEmployeeInput:
      type: object
      required:
        [employeeCode, fullName, workEmail, departmentId, jobRoleId, status]
      properties:
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }

    UpdateEmployeeInput:
      type: object
      properties:
        fullName: { type: string }
        departmentId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    Employee:
      type: object
      required:
        [
          id,
          employeeCode,
          fullName,
          workEmail,
          departmentId,
          jobRoleId,
          status,
          availability,
        ]
      properties:
        id: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        currentAllocation:
          type: integer
          description: >-
            Peak concurrent allocation effective today, computed by the shared sweep-line
            capacity engine over the single-day window [today, today]: allocations that are
            not cancelled and whose inclusive start and end dates contain today. Because it
            is a peak and not a sum, sequential allocations that do not overlap are never
            added together (TSD 10.3 / BR-G17). This is the figure behind the current
            availability indicator required by US02.01 - AC01.03.
        currentRemainingCapacity:
          type: integer
          description: 100 minus currentAllocation, floored at 0.
        availability:
          type: string
          enum: [AVAILABLE, PARTIAL, FULLY_ALLOCATED, NOT_ASSIGNABLE]
          description: >-
            Current availability for US02.01 - AC01.03, derived from
            currentRemainingCapacity. NOT_ASSIGNABLE is reported for INACTIVE employees
            per US05.01 - AC03.04. AVAILABLE, PARTIAL and FULLY_ALLOCATED follow
            US05.01 - AC03.01 to AC03.03.
        departmentId: { type: string, format: uuid }
        departmentName: { type: string }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }

    EmployeeDetail:
      allOf:
        - $ref: "#/components/schemas/Employee"
        - type: object
          properties:
            skills:
              type: array
              items:
                $ref: "#/components/schemas/EmployeeSkill"
            allocations:
              type: array
              items:
                $ref: "#/components/schemas/Allocation"
            evaluatedPeriod:
              type: object
              description: >-
                Capacity window result (US02.01 - AC04.04). peakConcurrentAllocation is the
                highest simultaneous allocation inside the window, computed by the shared
                sweep-line engine, and remainingCapacity is 100 minus that peak. Allocations
                that overlap the window without overlapping each other are never summed
                (TSD 10.3 / BR-G17).
              required:
                [
                  startDate,
                  endDate,
                  peakConcurrentAllocation,
                  remainingCapacity,
                ]
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                peakConcurrentAllocation: { type: integer }
                remainingCapacity: { type: integer }

    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CreateProjectInput:
      type: object
      required:
        [
          projectCode,
          name,
          projectManagerEmployeeId,
          startDate,
          endDate,
          status,
        ]
      properties:
        projectCode: { type: string }
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          {
            type: string,
            enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED],
            default: DRAFT,
          }

    UpdateProjectInput:
      type: object
      properties:
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }

    Project:
      type: object
      required:
        [
          id,
          projectCode,
          name,
          projectManagerEmployeeId,
          startDate,
          endDate,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        projectCode: { type: string }
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        projectManagerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }
        staffingRequirementCount: { type: integer, default: 0 }
        allocatedResourceCount: { type: integer, default: 0 }

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            staffingRequirements:
              type: array
              items:
                $ref: "#/components/schemas/StaffingRequirement"
            allocations:
              type: array
              items:
                $ref: "#/components/schemas/Allocation"

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    CreateStaffingRequirementInput:
      type: object
      required: [jobRoleId, headcount, allocationPercentage, startDate, endDate]
      properties:
        jobRoleId: { type: string, format: uuid }
        headcount: { type: integer, minimum: 1 }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        skills:
          type: array
          items:
            type: object
            required: [skillId, minimumProficiencyLevel]
            properties:
              skillId: { type: string, format: uuid }
              minimumProficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    UpdateStaffingRequirementInput:
      type: object
      properties:
        jobRoleId: { type: string, format: uuid }
        headcount: { type: integer, minimum: 1 }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        skills:
          type: array
          items:
            type: object
            required: [skillId, minimumProficiencyLevel]
            properties:
              skillId: { type: string, format: uuid }
              minimumProficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    StaffingRequirement:
      type: object
      required:
        [
          id,
          projectId,
          jobRoleId,
          jobRoleTitle,
          headcount,
          filledHeadcount,
          allocationPercentage,
          startDate,
          endDate,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        headcount: { type: integer }
        filledHeadcount: { type: integer }
        allocationPercentage: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, FULFILLED] }
        skills:
          type: array
          items:
            type: object
            properties:
              skillId: { type: string, format: uuid }
              skillName: { type: string }
              minimumProficiencyLevel: { type: integer }

    CreateAllocationInput:
      type: object
      required:
        [
          employeeId,
          projectId,
          jobRoleId,
          allocationPercentage,
          startDate,
          endDate,
        ]
      properties:
        employeeId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        staffingRequirementId: { type: string, format: uuid, nullable: true }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    UpdateAllocationInput:
      type: object
      properties:
        jobRoleId: { type: string, format: uuid }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    Allocation:
      type: object
      required:
        [
          id,
          employeeId,
          projectId,
          jobRoleId,
          allocationPercentage,
          startDate,
          endDate,
          displayStatus,
        ]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        projectCode: { type: string }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        staffingRequirementId: { type: string, format: uuid, nullable: true }
        allocationPercentage: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        displayStatus:
          { type: string, enum: [PLANNED, ACTIVE, ENDED, CANCELLED] }
        cancelledAt: { type: string, format: date-time, nullable: true }

    AllocationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"

    ResourceFinderItem:
      type: object
      required:
        [
          employeeId,
          employeeCode,
          fullName,
          workEmail,
          jobRoleTitle,
          departmentName,
          peakConcurrentAllocation,
          remainingCapacity,
          isAssignable,
        ]
      properties:
        employeeId: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string }
        jobRoleTitle: { type: string }
        departmentName: { type: string }
        peakConcurrentAllocation: { type: integer }
        remainingCapacity: { type: integer }
        isAssignable: { type: boolean }
        skills:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSkill"

    ResourceFinderResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResourceFinderItem"
        meta:
          type: object
          properties:
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            totalResults: { type: integer }

    OrganizationCapacityResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: string, format: uuid }
              fullName: { type: string }
              jobRoleTitle: { type: string }
              departmentName: { type: string }
              peakConcurrentAllocation: { type: integer }
              remainingCapacity: { type: integer }
              availabilityStatus:
                type: string
                enum: [FULLY_AVAILABLE, PARTIALLY_AVAILABLE, FULLY_ALLOCATED]
                description: >-
                  Availability as used by the capacity and resource-finder views. It is a
                  different vocabulary from `Employee.availability`, which reports
                  AVAILABLE / PARTIAL / FULLY_ALLOCATED / NOT_ASSIGNABLE: this enum has no
                  inactive case, and names the free states differently. Both describe the
                  same underlying figure, `remainingCapacity`, so a future revision should
                  collapse them into one shared enum. It is left as is here because no card
                  has implemented the resource-finder or capacity response yet, and the
                  workforce module does not own those contracts.

    DashboardData:
      type: object
      required:
        [
          totalActiveResources,
          totalActiveProjects,
          fullyAvailableResources,
          fullyAllocatedResources,
          openStaffingRequirements,
          capacityDistribution,
        ]
      properties:
        totalActiveResources: { type: integer }
        totalActiveProjects: { type: integer }
        fullyAvailableResources: { type: integer }
        fullyAllocatedResources: { type: integer }
        openStaffingRequirements: { type: integer }
        capacityDistribution:
          type: object
          properties:
            fullyAvailable: { type: integer }
            partiallyAvailable: { type: integer }
            fullyAllocated: { type: integer }
        accessibleProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"

    EmployeeSelfView:
      type: object
      required:
        [
          profile,
          skills,
          currentAllocations,
          plannedAllocations,
          currentTotalAllocation,
          remainingCapacity,
        ]
      properties:
        profile:
          $ref: "#/components/schemas/Employee"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeSkill"
        currentAllocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        plannedAllocations:
          type: array
          items:
            $ref: "#/components/schemas/Allocation"
        currentTotalAllocation: { type: integer }
        remainingCapacity: { type: integer }

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
