openapi: 3.1.0
info:
  title: Staffora REST API
  version: 1.0.0
  description: Authoritative OpenAPI 3.1 contract for Staffora - Project Resource Allocation & Workforce Planning System.
servers:
  - url: /api/v1
    description: Current Environment Base Path
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns 200 if the process is running.
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }

  /health/ready:
    get:
      summary: Readiness probe
      description: Returns 200 if the database and critical runtime dependencies are ready.
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }
                  database: { type: string, example: "connected" }
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: Sign in user
      description: |
        Authenticates user credentials, rotates the session ID (session fixation protection), and
        establishes the `staffora.sid` session cookie (HttpOnly, SameSite=Lax, Path=/, Secure in
        staging/production, 8-hour rolling inactivity timeout).
        Requires the `X-CSRF-Token` header like every other state-changing request: call
        `GET /auth/csrf-token` first to get a token on the anonymous session, then send it here.
        A successful login rotates the session and returns a new token in `data.csrfToken`.
        Unknown email and wrong password return the same generic 401 response.
        Limited to 5 attempts per 15 minutes per IP address and email.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  {
                    type: string,
                    format: email,
                    example: "admin@staffora.internal",
                  }
                password:
                  type: string
                  minLength: 1
                  description: Not checked against the 12-character creation policy, so the policy is never disclosed on sign-in.
                  example: "SuperSecret123!"

      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: New `staffora.sid` session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials (generic message) or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      summary: Sign out user
      description: Destroys the server-side session row (immediate revocation) and clears the session cookie.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Logged out successfully
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      summary: Current authenticated identity
      description: Retrieves the currently logged-in user profile, role, and linked employee details. Sessions of deactivated accounts are destroyed and receive 401.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserIdentity"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/csrf-token:
    get:
      summary: Retrieve CSRF token
      description: |
        Returns the synchronizer CSRF token stored in the current session, issuing one first if the
        session has none. Works without a login session: an anonymous session is created and its
        cookie returned, so the token can protect `POST /auth/login`. Send the token as
        `X-CSRF-Token` on every POST, PUT, PATCH, and DELETE request.
      security:
        - {}
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token value
          headers:
            Set-Cookie:
              description: "`staffora.sid` cookie of the anonymous session, when the request had none."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [csrfToken]
                    properties:
                      csrfToken: { type: string }

  /users:
    get:
      summary: List users (Admin only)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
    post:
      summary: Create user (Admin only)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserIdentity"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "409":
          description: User email already exists or employee already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"

  /users/{id}:
    patch:
      summary: Update user (Admin only)
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserIdentity"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"

  /departments:
    get:
      summary: List departments
      responses:
        "200":
          description: List of active departments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
    post:
      summary: Create department (Admin only)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Insufficient role. Only ADMIN may create master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            A department with this name already exists. The name is compared on a
            normalised, case-insensitive basis, so "IT" and "it" collide. Code is
            DUPLICATE_DEPARTMENT_NAME.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /job-roles:
    get:
      summary: List job roles
      responses:
        "200":
          description: List of active job roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRoleListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
    post:
      summary: Create job role (Admin only)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Job role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/JobRole"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Insufficient role. Only ADMIN may create master data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            A job role with this title already exists, compared on a normalised,
            case-insensitive basis. Code is DUPLICATE_JOB_ROLE_NAME.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees:
    get:
      summary: List employee workforce directory
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: jobRoleId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated employees
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: >-
            Insufficient role. The directory is readable by ADMIN, PROJECT_MANAGER
            and RESOURCE_MANAGER; an EMPLOYEE receives 403 here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Malformed query parameters, for example an unknown status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create employee profile
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInput"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Insufficient role. Only ADMIN and RESOURCE_MANAGER may create.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The employee code or work email already exists. Code is
            DUPLICATE_EMPLOYEE_CODE or DUPLICATE_WORK_EMAIL. The check is not
            atomic, so two concurrent creates with the same code resolve to one 201
            and one 409 carrying the same specific code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Malformed body, or a departmentId / jobRoleId that does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /employees/{id}:
    get:
      summary: Get employee detail
      description: Returns the employee profile with department, job role, skills, allocations, and the capacity evaluation for the requested window. An EMPLOYEE may only read their own record.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            First day of the capacity evaluation window (US02.01 - AC04.04). Defaults to
            today, taken as the current UTC calendar date; the window is a range of calendar
            days, not instants. When only startDate is given the window is that single day.
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            Last day of the capacity evaluation window, inclusive. Defaults to startDate, or
            to today (UTC) when startDate is also absent. Must not be before the effective
            startDate: a past endDate with no startDate is rejected with 422 on `endDate`,
            because the default startDate of today would otherwise sit after it.
      responses:
        "200":
          description: Employee detail with skills, allocations, and capacity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          description: >-
            Employee not found, or a record the caller may not see. An EMPLOYEE requesting
            another employee's profile receives the same 404 as an unknown id, so the
            response cannot be used to enumerate employee ids.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Malformed employee id, or an invalid capacity date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update employee profile
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeInput"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Employee"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The update collides with an existing unique value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Malformed employee id or body, an empty body, or a departmentId /
            jobRoleId that does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /skills:
    get:
      summary: List skill catalog
      responses:
        "200":
          description: List of skills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
    post:
      summary: Create skill (Admin/Resource Manager)
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Skill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Skill"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"

  /employees/{id}/skills:
    get:
      summary: Get employee skills
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List of employee skills with proficiency
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmployeeSkill"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
    post:
      summary: Assign skill to employee
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId, proficiencyLevel]
              properties:
                skillId: { type: string, format: uuid }
                proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "201":
          description: Skill assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeSkill"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"

  /employees/{id}/skills/{skillId}:
    patch:
      summary: Update employee skill proficiency
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: skillId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proficiencyLevel]
              properties:
                proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }
      responses:
        "200":
          description: Proficiency updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EmployeeSkill"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
    delete:
      summary: Remove skill from employee
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: skillId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Skill removed
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"

  /projects:
    get:
      summary: List projects
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            {
              type: string,
              enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED],
            }
        - name: projectManagerEmployeeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"
    post:
      summary: Create project
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
        "501":
          $ref: "#/components/responses/NotImplementedResponse"

  /projects/{id}:
    get:
      summary: Get project detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Project detail with staffing requirements and allocations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
    patch:
      summary: Update project
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectInput"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"

  /projects/{id}/staffing-requirements:
    get:
      summary: List project staffing requirements
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Staffing requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffingRequirement"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "422":
          $ref: "#/components/responses/ValidationErrorResponse"
    post:
      summary: Create staffing requirement for project
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaffingRequirementInput"
      responses:
        "201":
          description: Staffing requirement created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StaffingRequirement"
        "401":
