openapi: 3.1.0
info:
  title: Staffora REST API
  version: 1.0.0
  description: Authoritative OpenAPI 3.1 contract for Staffora - Project Resource Allocation & Workforce Planning System.
servers:
  - url: /api/v1
    description: Current Environment Base Path
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns 200 if the process is running.
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }

  /health/ready:
    get:
      summary: Readiness probe
      description: Returns 200 if the database and critical runtime dependencies are ready.
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }
                  database: { type: string, example: "connected" }
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Sign in user
      description: Authenticates user credentials, rotates session ID, and establishes an HTTP-only session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "admin@staffora.internal" }
                password: { type: string, minLength: 12, example: "SuperSecret123!" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserIdentity'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Sign out user
      description: Destroys current session and clears the session cookie.
      responses:
        '204':
          description: Logged out successfully

  /auth/me:
    get:
      summary: Current authenticated identity
      description: Retrieves the currently logged-in user profile, role, and linked employee details.
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserIdentity'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/csrf-token:
    get:
      summary: Retrieve CSRF token
      description: Returns the active synchronizer CSRF token stored in the current session.
      responses:
        '200':
          description: CSRF token value
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      csrfToken: { type: string }

  /departments:
    get:
      summary: List departments
      responses:
        '200':
          description: List of active departments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
    post:
      summary: Create department (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Department'

  /job-roles:
    get:
      summary: List job roles
      responses:
        '200':
          description: List of active job roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRoleListResponse'
    post:
      summary: Create job role (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Job role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobRole'

  /employees:
    get:
      summary: List employee workforce directory
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: jobRoleId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated employees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
    post:
      summary: Create employee profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeInput'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'

  /employees/{id}:
    get:
      summary: Get employee detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Employee detail with skills, allocations, and capacity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeDetail'
    patch:
      summary: Update employee profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeInput'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'

  /skills:
    get:
      summary: List skill catalog
      responses:
        '200':
          description: List of skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
    post:
      summary: Create skill (Admin/Resource Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'

  /employees/{id}/skills:
    get:
      summary: Get employee skills
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of employee skills with proficiency
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeSkill'
    post:
      summary: Assign skill to employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId, proficiencyLevel]
              properties:
                skillId: { type: string, format: uuid }
                proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '201':
          description: Skill assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeSkill'

  /projects:
    get:
      summary: List projects
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }
        - name: projectManagerEmployeeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'

  /projects/{id}:
    get:
      summary: Get project detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project detail with staffing requirements and allocations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectDetail'
    patch:
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'

  /projects/{id}/staffing-requirements:
    get:
      summary: List project staffing requirements
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Staffing requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffingRequirement'
    post:
      summary: Create staffing requirement for project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffingRequirementInput'
      responses:
        '201':
          description: Staffing requirement created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffingRequirement'

  /allocations:
    get:
      summary: List allocations
      parameters:
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: List of allocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationListResponse'
    post:
      summary: Create resource allocation
      description: Validates employee capacity under row lock before saving. Rejects if total concurrent allocation exceeds 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllocationInput'
      responses:
        '201':
          description: Allocation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'
        '409':
          description: Capacity conflict or validation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityConflictResponse'

  /allocations/{id}:
    patch:
      summary: Update allocation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAllocationInput'
      responses:
        '200':
          description: Allocation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'
        '409':
          description: Capacity conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityConflictResponse'

  /allocations/{id}/end:
    post:
      summary: End active allocation early
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endDate]
              properties:
                endDate: { type: string, format: date }
      responses:
        '200':
          description: Allocation ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'

  /allocations/{id}/cancel:
    post:
      summary: Cancel planned allocation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Allocation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'

  /resource-finder:
    get:
      summary: Search available resources
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: jobRoleId
          in: query
          schema: { type: string, format: uuid }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: skillId
          in: query
          schema: { type: string, format: uuid }
        - name: minProficiency
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: minRemainingCapacity
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Search results with peak concurrent allocation and remaining capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFinderResponse'

  /capacity:
    get:
      summary: Query organization capacity
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capacity summaries across employees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCapacityResponse'

  /dashboard:
    get:
      summary: Role-scoped dashboard summary
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardData'

  /me:
    get:
      summary: Employee self-view
      description: Returns self profile, skills, current and upcoming allocations, and capacity.
      responses:
        '200':
          description: Employee personal summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeSelfView'

components:
  schemas:
    ErrorResponse:
      type: object
      required: [message, code, errors, meta, requestId]
      properties:
        message: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        meta: { type: object }
        requestId: { type: string }

    CapacityConflictResponse:
      type: object
      required: [message, code, errors, meta, requestId]
      properties:
        message: { type: string, example: "Allocation exceeds employee capacity." }
        code: { type: string, example: "CAPACITY_CONFLICT" }
        errors: { type: object }
        meta:
          type: object
          required: [peakAllocation, requestedAllocation, remainingCapacity, conflictStartDate, conflictEndDate]
          properties:
            peakAllocation: { type: integer, example: 80 }
            requestedAllocation: { type: integer, example: 30 }
            remainingCapacity: { type: integer, example: 20 }
            conflictStartDate: { type: string, format: date, example: "2026-11-01" }
            conflictEndDate: { type: string, format: date, example: "2026-11-15" }
        requestId: { type: string }

    UserIdentity:
      type: object
      required: [id, email, role, isActive]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, PROJECT_MANAGER, RESOURCE_MANAGER, EMPLOYEE] }
        isActive: { type: boolean }
        employeeId: { type: string, format: uuid, nullable: true }
        employee:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            employeeCode: { type: string }
            fullName: { type: string }
            workEmail: { type: string }
            departmentName: { type: string }
            jobRoleTitle: { type: string }

    Department:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    DepartmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    JobRole:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    JobRoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobRole'

    Skill:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    SkillListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Skill'

    EmployeeSkill:
      type: object
      required: [id, skillId, skillName, proficiencyLevel]
      properties:
        id: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        skillName: { type: string }
        proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    CreateEmployeeInput:
      type: object
      required: [employeeCode, fullName, workEmail, departmentId, jobRoleId, status]
      properties:
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }

    UpdateEmployeeInput:
      type: object
      properties:
        fullName: { type: string }
        departmentId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    Employee:
      type: object
      required: [id, employeeCode, fullName, workEmail, departmentId, jobRoleId, status]
      properties:
        id: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string }
        departmentId: { type: string, format: uuid }
        departmentName: { type: string }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        currentAllocation: { type: integer, default: 0 }
        currentRemainingCapacity: { type: integer, default: 100 }

    EmployeeDetail:
      allOf:
        - $ref: '#/components/schemas/Employee'
        - type: object
          properties:
            skills:
              type: array
              items:
                $ref: '#/components/schemas/EmployeeSkill'
            allocations:
              type: array
              items:
                $ref: '#/components/schemas/Allocation'
            evaluatedPeriod:
              type: object
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                peakConcurrentAllocation: { type: integer }
                remainingCapacity: { type: integer }

    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateProjectInput:
      type: object
      required: [projectCode, name, projectManagerEmployeeId, startDate, endDate, status]
      properties:
        projectCode: { type: string }
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED], default: DRAFT }

    UpdateProjectInput:
      type: object
      properties:
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }

    Project:
      type: object
      required: [id, projectCode, name, projectManagerEmployeeId, startDate, endDate, status]
      properties:
        id: { type: string, format: uuid }
        projectCode: { type: string }
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        projectManagerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }
        staffingRequirementCount: { type: integer, default: 0 }
        allocatedResourceCount: { type: integer, default: 0 }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            staffingRequirements:
              type: array
              items:
                $ref: '#/components/schemas/StaffingRequirement'
            allocations:
              type: array
              items:
                $ref: '#/components/schemas/Allocation'

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateStaffingRequirementInput:
      type: object
      required: [jobRoleId, headcount, allocationPercentage, startDate, endDate]
      properties:
        jobRoleId: { type: string, format: uuid }
        headcount: { type: integer, minimum: 1 }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        skills:
          type: array
          items:
            type: object
            required: [skillId, minimumProficiencyLevel]
            properties:
              skillId: { type: string, format: uuid }
              minimumProficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    StaffingRequirement:
      type: object
      required: [id, projectId, jobRoleId, jobRoleTitle, headcount, filledHeadcount, allocationPercentage, startDate, endDate, status]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        headcount: { type: integer }
        filledHeadcount: { type: integer }
        allocationPercentage: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, FULFILLED] }
