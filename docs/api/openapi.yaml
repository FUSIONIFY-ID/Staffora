openapi: 3.1.0
info:
  title: Staffora REST API
  version: 1.0.0
  description: Authoritative OpenAPI 3.1 contract for Staffora - Project Resource Allocation & Workforce Planning System.
servers:
  - url: /api/v1
    description: Current Environment Base Path
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Returns 200 if the process is running.
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }

  /health/ready:
    get:
      summary: Readiness probe
      description: Returns 200 if the database and critical runtime dependencies are ready.
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ready" }
                  database: { type: string, example: "connected" }
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Sign in user
      description: |
        Authenticates user credentials, rotates the session ID (session fixation protection), and
        establishes the `staffora.sid` session cookie (HttpOnly, SameSite=Lax, Path=/, Secure in
        staging/production, 8-hour rolling inactivity timeout).
        Requires the `X-CSRF-Token` header like every other state-changing request: call
        `GET /auth/csrf-token` first to get a token on the anonymous session, then send it here.
        A successful login rotates the session and returns a new token in `data.csrfToken`.
        Unknown email and wrong password return the same generic 401 response.
        Limited to 5 attempts per 15 minutes per IP address and email.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "admin@staffora.internal" }
                password:
                  type: string
                  minLength: 1
                  description: Not checked against the 12-character creation policy, so the policy is never disclosed on sign-in.
                  example: "SuperSecret123!"
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: New `staffora.sid` session cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
        '401':
          description: Invalid credentials (generic message) or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Sign out user
      description: Destroys the server-side session row (immediate revocation) and clears the session cookie.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing or invalid CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      summary: Current authenticated identity
      description: Retrieves the currently logged-in user profile, role, and linked employee details. Sessions of deactivated accounts are destroyed and receive 401.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Authenticated user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserIdentity'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/csrf-token:
    get:
      summary: Retrieve CSRF token
      description: |
        Returns the synchronizer CSRF token stored in the current session, issuing one first if the
        session has none. Works without a login session: an anonymous session is created and its
        cookie returned, so the token can protect `POST /auth/login`. Send the token as
        `X-CSRF-Token` on every POST, PUT, PATCH, and DELETE request.
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: CSRF token value
          headers:
            Set-Cookie:
              description: "`staffora.sid` cookie of the anonymous session, when the request had none."
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [csrfToken]
                    properties:
                      csrfToken: { type: string }

  /departments:
    get:
      summary: List departments
      responses:
        '200':
          description: List of active departments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'
    post:
      summary: Create department (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Department created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Department'

  /job-roles:
    get:
      summary: List job roles
      responses:
        '200':
          description: List of active job roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRoleListResponse'
    post:
      summary: Create job role (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Job role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobRole'

  /employees:
    get:
      summary: List employee workforce directory
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: jobRoleId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE] }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated employees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
    post:
      summary: Create employee profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeInput'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'

  /employees/{id}:
    get:
      summary: Get employee detail
      description: Returns the employee profile with department, job role, skills, allocations, and a capacity summary. An EMPLOYEE may only read their own record.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            First day of the capacity evaluation window (US02.01 - AC04.04). Defaults to
            today. When only startDate is given the window is that single day.
        - name: endDate
          in: query
          required: false
          schema: { type: string, format: date }
          description: >-
            Last day of the capacity evaluation window, inclusive. Defaults to startDate,
            or to today when startDate is also absent. Must not be before startDate.
      responses:
        '200':
          description: Employee detail with skills, allocations, and capacity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeDetail'
        '404':
          description: >-
            Employee not found, or a record the caller may not see. An EMPLOYEE requesting
            another employee's profile receives the same 404 as an unknown id, so the
            response cannot be used to enumerate employee ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Malformed employee id, or an invalid capacity date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update employee profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeInput'
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Employee'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /skills:
    get:
      summary: List skill catalog
      responses:
        '200':
          description: List of skills
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillListResponse'
    post:
      summary: Create skill (Admin/Resource Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Skill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Skill'

  /employees/{id}/skills:
    get:
      summary: Get employee skills
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: List of employee skills with proficiency
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeSkill'
    post:
      summary: Assign skill to employee
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skillId, proficiencyLevel]
              properties:
                skillId: { type: string, format: uuid }
                proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '201':
          description: Skill assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeSkill'

  /projects:
    get:
      summary: List projects
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }
        - name: projectManagerEmployeeId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'

  /projects/{id}:
    get:
      summary: Get project detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Project detail with staffing requirements and allocations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectDetail'
    patch:
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Project'

  /projects/{id}/staffing-requirements:
    get:
      summary: List project staffing requirements
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Staffing requirements
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffingRequirement'
    post:
      summary: Create staffing requirement for project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffingRequirementInput'
      responses:
        '201':
          description: Staffing requirement created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/StaffingRequirement'

  /allocations:
    get:
      summary: List allocations
      parameters:
        - name: employeeId
          in: query
          schema: { type: string, format: uuid }
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: List of allocations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationListResponse'
    post:
      summary: Create resource allocation
      description: Validates employee capacity under row lock before saving. Rejects if total concurrent allocation exceeds 100%.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAllocationInput'
      responses:
        '201':
          description: Allocation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'
        '409':
          description: Capacity conflict or validation conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityConflictResponse'

  /allocations/{id}:
    patch:
      summary: Update allocation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAllocationInput'
      responses:
        '200':
          description: Allocation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'
        '409':
          description: Capacity conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityConflictResponse'

  /allocations/{id}/end:
    post:
      summary: End active allocation early
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endDate]
              properties:
                endDate: { type: string, format: date }
      responses:
        '200':
          description: Allocation ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'

  /allocations/{id}/cancel:
    post:
      summary: Cancel planned allocation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Allocation cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Allocation'

  /resource-finder:
    get:
      summary: Search available resources
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: jobRoleId
          in: query
          schema: { type: string, format: uuid }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: skillId
          in: query
          schema: { type: string, format: uuid }
        - name: minProficiency
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: minRemainingCapacity
          in: query
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Search results with peak concurrent allocation and remaining capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceFinderResponse'

  /capacity:
    get:
      summary: Query organization capacity
      parameters:
        - name: startDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: endDate
          in: query
          required: true
          schema: { type: string, format: date }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capacity summaries across employees
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCapacityResponse'

  /dashboard:
    get:
      summary: Role-scoped dashboard summary
      parameters:
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardData'

  /me:
    get:
      summary: Employee self-view
      description: Returns self profile, skills, current and upcoming allocations, and capacity.
      responses:
        '200':
          description: Employee personal summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EmployeeSelfView'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: staffora.sid
      description: Server-side session stored in PostgreSQL `user_sessions` (ADR-006).
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token from login or `GET /auth/csrf-token`; required on every POST, PUT, PATCH, and DELETE, including `POST /auth/login`.
  schemas:
    ErrorResponse:
      type: object
      required: [message, code, errors, meta, requestId]
      properties:
        message: { type: string }
        code: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        meta: { type: object }
        requestId: { type: string }

    CapacityConflictResponse:
      type: object
      required: [message, code, errors, meta, requestId]
      properties:
        message: { type: string, example: "Allocation exceeds employee capacity." }
        code: { type: string, example: "CAPACITY_CONFLICT" }
        errors: { type: object }
        meta:
          type: object
          required: [peakAllocation, requestedAllocation, remainingCapacity, conflictStartDate, conflictEndDate]
          properties:
            peakAllocation: { type: integer, example: 80 }
            requestedAllocation: { type: integer, example: 30 }
            remainingCapacity: { type: integer, example: 20 }
            conflictStartDate: { type: string, format: date, example: "2026-11-01" }
            conflictEndDate: { type: string, format: date, example: "2026-11-15" }
        requestId: { type: string }

    UserIdentity:
      type: object
      required: [id, email, role, isActive]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, PROJECT_MANAGER, RESOURCE_MANAGER, EMPLOYEE] }
        isActive: { type: boolean }
        employeeId: { type: string, format: uuid, nullable: true }
        employee:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            employeeCode: { type: string }
            fullName: { type: string }
            workEmail: { type: string }
            departmentId: { type: string, format: uuid }
            departmentName: { type: string }
            jobRoleId: { type: string, format: uuid }
            jobRoleTitle: { type: string }

    LoginResult:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/UserIdentity'
        csrfToken:
          type: string
          description: Synchronizer token for the new session; send as `X-CSRF-Token` on state-changing requests.

    Department:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    DepartmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'

    JobRole:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    JobRoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobRole'

    Skill:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }

    SkillListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Skill'

    EmployeeSkill:
      type: object
      required: [id, skillId, skillName, skillIsActive, proficiencyLevel]
      properties:
        id: { type: string, format: uuid }
        skillId: { type: string, format: uuid }
        skillName: { type: string }
        skillIsActive: { type: boolean }
        proficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    EmployeeCapacitySummary:
      type: object
      required: [evaluatedPeriod, activeAllocation, peakConcurrentAllocation, remainingCapacity, hasCapacityConflict]
      properties:
        evaluatedPeriod:
          type: object
          required: [startDate, endDate]
          properties:
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
        activeAllocation: { type: integer, example: 50 }
        peakConcurrentAllocation: { type: integer, example: 50 }
        remainingCapacity: { type: integer, example: 50 }
        hasCapacityConflict: { type: boolean }

    CreateEmployeeInput:
      type: object
      required: [employeeCode, fullName, workEmail, departmentId, jobRoleId, status]
      properties:
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string, format: email }
        departmentId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }

    UpdateEmployeeInput:
      type: object
      properties:
        fullName: { type: string }
        departmentId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    Employee:
      type: object
      required: [id, employeeCode, fullName, workEmail, departmentId, departmentName, jobRoleId, jobRoleTitle, status, currentAllocation, currentRemainingCapacity, availability, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        currentAllocation:
          type: integer
          description: >-
            Sum of the allocation percentage that is effective today: not cancelled, and
            today falls inside the inclusive start and end date. This is the figure behind
            the current availability indicator required by US02.01 - AC01.03.
        currentRemainingCapacity:
          type: integer
          description: 100 minus currentAllocation, floored at 0.
        availability:
          type: string
          enum: [AVAILABLE, PARTIAL, FULLY_ALLOCATED, NOT_ASSIGNABLE]
          description: >-
            Current availability for US02.01 - AC01.03, derived from
            currentRemainingCapacity. NOT_ASSIGNABLE is reported for INACTIVE employees
            per US05.01 - AC03.04. AVAILABLE, PARTIAL and FULLY_ALLOCATED follow
            US05.01 - AC03.01 to AC03.03.
        departmentId: { type: string, format: uuid }
        departmentName: { type: string }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EmployeeDetail:
      allOf:
        - $ref: '#/components/schemas/Employee'
        - type: object
          properties:
            department:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            jobRole:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            skills:
              type: array
              items:
                $ref: '#/components/schemas/EmployeeSkill'
            allocations:
              type: array
              items:
                $ref: '#/components/schemas/EmployeeAllocation'
            evaluatedPeriod:
              type: object
              description: >-
                Top-level window result retained from the approved contract in dev.
                capacitySummary carries the same window plus activeAllocation and
                hasCapacityConflict.
              required: [startDate, endDate, peakConcurrentAllocation, remainingCapacity]
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                peakConcurrentAllocation: { type: integer }
                remainingCapacity: { type: integer }
            capacitySummary:
              $ref: '#/components/schemas/EmployeeCapacitySummary'

    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateProjectInput:
      type: object
      required: [projectCode, name, projectManagerEmployeeId, startDate, endDate, status]
      properties:
        projectCode: { type: string }
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED], default: DRAFT }

    UpdateProjectInput:
      type: object
      properties:
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }

    Project:
      type: object
      required: [id, projectCode, name, projectManagerEmployeeId, startDate, endDate, status]
      properties:
        id: { type: string, format: uuid }
        projectCode: { type: string }
        name: { type: string }
        projectManagerEmployeeId: { type: string, format: uuid }
        projectManagerName: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [DRAFT, PLANNED, ACTIVE, COMPLETED, ARCHIVED] }
        staffingRequirementCount: { type: integer, default: 0 }
        allocatedResourceCount: { type: integer, default: 0 }

    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          properties:
            staffingRequirements:
              type: array
              items:
                $ref: '#/components/schemas/StaffingRequirement'
            allocations:
              type: array
              items:
                $ref: '#/components/schemas/Allocation'

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateStaffingRequirementInput:
      type: object
      required: [jobRoleId, headcount, allocationPercentage, startDate, endDate]
      properties:
        jobRoleId: { type: string, format: uuid }
        headcount: { type: integer, minimum: 1 }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        skills:
          type: array
          items:
            type: object
            required: [skillId, minimumProficiencyLevel]
            properties:
              skillId: { type: string, format: uuid }
              minimumProficiencyLevel: { type: integer, minimum: 1, maximum: 5 }

    StaffingRequirement:
      type: object
      required: [id, projectId, jobRoleId, jobRoleTitle, headcount, filledHeadcount, allocationPercentage, startDate, endDate, status]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        headcount: { type: integer }
        filledHeadcount: { type: integer }
        allocationPercentage: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, FULFILLED] }
        skills:
          type: array
          items:
            type: object
            properties:
              skillId: { type: string, format: uuid }
              skillName: { type: string }
              minimumProficiencyLevel: { type: integer }

    CreateAllocationInput:
      type: object
      required: [employeeId, projectId, jobRoleId, allocationPercentage, startDate, endDate]
      properties:
        employeeId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        jobRoleId: { type: string, format: uuid }
        staffingRequirementId: { type: string, format: uuid, nullable: true }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    UpdateAllocationInput:
      type: object
      properties:
        jobRoleId: { type: string, format: uuid }
        allocationPercentage: { type: integer, minimum: 1, maximum: 100 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    Allocation:
      type: object
      required: [id, employeeId, projectId, jobRoleId, allocationPercentage, startDate, endDate, displayStatus]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        projectCode: { type: string }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        staffingRequirementId: { type: string, format: uuid, nullable: true }
        allocationPercentage: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        displayStatus: { type: string, enum: [PLANNED, ACTIVE, ENDED, CANCELLED] }
        cancelledAt: { type: string, format: date-time, nullable: true }

    AllocationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'

    EmployeeAllocation:
      type: object
      required: [id, projectId, projectCode, projectName, jobRoleId, jobRoleTitle, allocationPercentage, startDate, endDate, displayStatus, cancelledAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectCode: { type: string }
        projectName: { type: string }
        jobRoleId: { type: string, format: uuid }
        jobRoleTitle: { type: string }
        allocationPercentage: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        displayStatus: { type: string, enum: [PLANNED, ACTIVE, ENDED, CANCELLED] }
        cancelledAt: { type: string, format: date-time, nullable: true }

    ResourceFinderItem:
      type: object
      required: [employeeId, employeeCode, fullName, workEmail, jobRoleTitle, departmentName, peakConcurrentAllocation, remainingCapacity, isAssignable]
      properties:
        employeeId: { type: string, format: uuid }
        employeeCode: { type: string }
        fullName: { type: string }
        workEmail: { type: string }
        jobRoleTitle: { type: string }
        departmentName: { type: string }
        peakConcurrentAllocation: { type: integer }
        remainingCapacity: { type: integer }
        isAssignable: { type: boolean }
        skills:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSkill'

    ResourceFinderResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceFinderItem'
        meta:
          type: object
          properties:
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            totalResults: { type: integer }

    OrganizationCapacityResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              employeeId: { type: string, format: uuid }
              fullName: { type: string }
              jobRoleTitle: { type: string }
              departmentName: { type: string }
              peakConcurrentAllocation: { type: integer }
              remainingCapacity: { type: integer }
              availabilityStatus: { type: string, enum: [FULLY_AVAILABLE, PARTIALLY_AVAILABLE, FULLY_ALLOCATED] }

    DashboardData:
      type: object
      required: [totalActiveResources, totalActiveProjects, fullyAvailableResources, fullyAllocatedResources, openStaffingRequirements, capacityDistribution]
      properties:
        totalActiveResources: { type: integer }
        totalActiveProjects: { type: integer }
        fullyAvailableResources: { type: integer }
        fullyAllocatedResources: { type: integer }
        openStaffingRequirements: { type: integer }
        capacityDistribution:
          type: object
          properties:
            fullyAvailable: { type: integer }
            partiallyAvailable: { type: integer }
            fullyAllocated: { type: integer }
        accessibleProjects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    EmployeeSelfView:
      type: object
      required: [profile, skills, currentAllocations, plannedAllocations, currentTotalAllocation, remainingCapacity]
      properties:
        profile:
          $ref: '#/components/schemas/Employee'
        skills:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeSkill'
        currentAllocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        plannedAllocations:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        currentTotalAllocation: { type: integer }
        remainingCapacity: { type: integer }

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
