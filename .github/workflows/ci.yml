name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: the validation job only reads the repository.
permissions:
  contents: read

# Superseded validation runs are cancelled; only the latest result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: staffora
          POSTGRES_PASSWORD: staffora_local
          POSTGRES_DB: staffora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staffora -d staffora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://staffora:staffora_local@localhost:5432/staffora
      SESSION_SECRET: local-dev-session-secret-at-least-32-characters-long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate -w @staffora/api

      - name: Code Quality Checks (Lint)
        run: npm run lint

      - name: Static Typecheck
        run: npm run typecheck

      - name: Apply Database Migrations & Seed
        run: |
          npm run db:migrate:deploy -w @staffora/api
          npm run db:seed -w @staffora/api

      # Fails when schema.prisma has model changes that no committed migration covers,
      # so drift cannot reach main. Exit codes: 0 = in sync, 2 = drift.
      - name: Validate Migration Drift
        working-directory: apps/api
        run: npx prisma migrate diff --from-config-datasource --to-schema=prisma/schema.prisma --exit-code

      - name: Automated Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build
